<text x="480.0" y="266" text-anchor="middle" fill="#444">seconds after the echoed "hello" (idle time)</text>
<rect x="8" y="62" width="894" height="78" rx="6" fill="#f3f3ef"/>
<text x="16" y="80"><tspan font-weight="600" fill="#1d1d1b">008 · Chrome page</tspan><tspan fill="#555">   server KA 2 min (default) → aborted at 100 s</tspan></text>
<text x="112" y="106" text-anchor="end" fill="#888" font-size="11">client ↔ YARP</text>
<line x1="120" y1="102" x2="840" y2="102" stroke="#bbb"/>
<text x="345.3" y="107" text-anchor="middle" font-size="15" font-weight="700" fill="#c62828">✕<title>TCP closed at 100.1s</title></text>
<text x="355.3" y="98" font-size="11" fill="#c62828">TCP closed by YARP at 100.1s (no WebSocket Close frame)</text>
<text x="112" y="132" text-anchor="end" fill="#888" font-size="11">YARP ↔ server</text>
<line x1="120" y1="128" x2="840" y2="128" stroke="#bbb"/>
<text x="345.0" y="133" text-anchor="middle" font-size="15" font-weight="700" fill="#c62828">✕<title>TCP closed at 100.0s</title></text>
<text x="355.0" y="124" font-size="11" fill="#c62828">TCP closed by YARP at 100.0s (no WebSocket Close frame)</text>
<rect x="8" y="146" width="894" height="78" rx="6" fill="#fafaf8"/>
<text x="16" y="164"><tspan font-weight="600" fill="#1d1d1b">009 · Chrome page</tspan><tspan fill="#555">   server KA 30 s → survives</tspan></text>
<text x="112" y="190" text-anchor="end" fill="#888" font-size="11">client ↔ YARP</text>
