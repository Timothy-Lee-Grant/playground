<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Idle WebSocket through YARP (browser client)</title>
<style>
  body { font: 15px/1.45 -apple-system, system-ui, sans-serif; margin: 24px; background: #f6f6f4; color: #1d1d1b; }
  h1 { font-size: 20px; margin: 0 0 4px; }
  .sub { color: #666; margin-bottom: 16px; }
  .row { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; margin-bottom: 12px; }
  input { font: 14px ui-monospace, monospace; padding: 6px 8px; width: 260px; }
  button { font-size: 14px; padding: 6px 14px; }
  .status { display: flex; gap: 16px; flex-wrap: wrap; margin: 12px 0; }
  .tile { background: #fff; border: 1px solid #ddd; border-radius: 8px; padding: 10px 14px; min-width: 150px; }
  .tile .k { font-size: 12px; color: #666; text-transform: uppercase; letter-spacing: .04em; }
  .tile .v { font: 600 22px ui-monospace, monospace; }
  .open { color: #1a7f37; } .closed { color: #c62828; }
  pre { background: #1e1e1e; color: #e6e6e6; padding: 12px; border-radius: 8px; font: 13px/1.5 ui-monospace, monospace;
        white-space: pre-wrap; min-height: 180px; }
</style>
</head>
<body>
<h1>Idle WebSocket through YARP: browser client</h1>
<div class="sub">Sends one message, then stays silent. The browser <code>WebSocket</code> API has no way to send Ping frames.</div>
<div class="row">
  <input id="url" value="ws://localhost:5001/ws">
  <button id="go">Connect and go idle</button>
</div>
<div class="status">
  <div class="tile"><div class="k">state</div><div class="v" id="state">not connected</div></div>
  <div class="tile"><div class="k">idle for</div><div class="v" id="idle">–</div></div>
  <div class="tile"><div class="k">close code</div><div class="v" id="code">–</div></div>
  <div class="tile"><div class="k">wasClean</div><div class="v" id="clean">–</div></div>
</div>
<pre id="log"></pre>
<script>
  const $ = id => document.getElementById(id);
  let idleStart = null, ticker = null;
  function log(msg) {
    const t = new Date().toLocaleTimeString([], { hour12: false });
    const e = idleStart ? ` [+${((performance.now() - idleStart) / 1000).toFixed(1)}s]` : "";
    $("log").textContent += `${t}${e}  ${msg}\n`;
    console.log(`[idle-ws]${e} ${msg}`);
  }
  $("go").onclick = () => {
    $("go").disabled = true;
    const ws = new WebSocket($("url").value);
    log(`connecting to ${ws.url}`);
    ws.onopen = () => { $("state").textContent = "OPEN"; $("state").className = "v open"; log("open; sending 'hello'"); ws.send("hello"); };
    ws.onmessage = ev => {
      log(`received: ${ev.data}`);
      if (!idleStart) {
        idleStart = performance.now();
        log("now idle: sending nothing");
        ticker = setInterval(() => { $("idle").textContent = ((performance.now() - idleStart) / 1000).toFixed(0) + " s"; }, 250);
      }
    };
    ws.onerror = () => log("error event");
    ws.onclose = ev => {
      clearInterval(ticker);
      const idle = idleStart ? ((performance.now() - idleStart) / 1000).toFixed(1) + " s" : "–";
      $("idle").textContent = idle;
      $("state").textContent = "CLOSED"; $("state").className = "v closed";
      $("code").textContent = ev.code; $("clean").textContent = ev.wasClean;
      log(`close event: code=${ev.code} reason='${ev.reason}' wasClean=${ev.wasClean} after ${idle} idle`);
    };
  };
  // ?auto=1 connects on load (used for scripted headless-Chrome screenshots); ?url= overrides the target.
  const q = new URLSearchParams(location.search);
  if (q.get("url")) $("url").value = q.get("url");
  if (q.get("auto")) $("go").click();
</script>
</body>
</html>
